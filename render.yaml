# Render.com blueprint -- https://render.com/docs/blueprint-spec
# Deploy: connect the repo on Render and it will pick this file up
# automatically ("New +" -> "Blueprint").
services:
  - type: web
    name: invoice-intelligence-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
